# Render Blueprint: one Docker web service + one Postgres database.
# Render > New > Blueprint > pick this repository. You are asked for the two secrets marked sync:false.
databases:
  - name: ceda-portal-db
    plan: free
    databaseName: fundinglens
    user: fundinglens
services:
  - type: web
    name: ceda-innovation-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass   # deploy only after GitHub CI is green
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ceda-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: DEFAULT_INSTITUTION_NAME
        value: CEDA Innovation Management Portal (Prototype)
      - key: PORTAL_URL
        value: https://ceda-innovation-portal.onrender.com
      # Until an email service is connected, sign-up and reset codes are shown on screen so the demo can be tried.
      # Set to "false" as soon as BREVO_API_KEY (or SMTP_HOST) is filled in.
      - key: DEMO_SHOW_CODES
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
